# Baut SongBridge als eigenständiges Programm für macOS und Windows.
# Ergebnis: unter „Actions“ beim jeweiligen Lauf als Download (Artifacts).
# Jeder Push auf master wird zusätzlich als GitHub-Release veröffentlicht – dort holt sich das
# Programm seine Updates ab (updater.py). Versionsnummer: Datum + Laufnummer, z. B. 2026.10.09.42.
name: Programm bauen

on:
  workflow_dispatch:
  push:
    branches: ["master", "main", "claude/**"]

permissions:
  contents: write

# Zwei schnelle Pushes: der ältere Lauf wird abgebrochen, damit kein älteres Release das neuere überholt.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1 und neuer)
            name: macOS-AppleSilicon
          - os: macos-15-intel      # Intel-Macs
            name: macOS-Intel
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Versionsnummer
        shell: bash
        run: echo '__version__ = "${{ needs.version.outputs.version }}"' > songbridge/version.py
      - name: Bauen
        run: pyinstaller --noconfirm --clean packaging/SongBridge.spec
      - name: Kurztest
        shell: bash
        run: |
          export SONGBRIDGE_NO_UPDATE=1
          ./dist/SongBridge* --no-browser --port 5123 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5123/api/config && break; sleep 1; done
          curl -sf http://127.0.0.1:5123/api/config | grep -q '"${{ needs.version.outputs.version }}"'
          curl -sf http://127.0.0.1:5123/ > /dev/null
      - name: Paket schnüren
        shell: bash
        run: |
          mkdir -p pkg
          cp dist/SongBridge* pkg/
          cp docs/ANLEITUNG.md pkg/
          cp songbridge/propresenter/proto/LICENSE-ProPresenter7-Proto pkg/
          (cd pkg && 7z a ../SongBridge-${{ matrix.name }}.zip . > /dev/null)
          # Übergang von früheren Namen: ältere Versionen suchen „<Name>-*.zip“ mit „<Name>*“ darin
          # (2026.10.09.8 = Liederverwaltung, .12–.14 = Liedbruecke).
          for old in Liederverwaltung Liedbruecke; do
            mkdir -p "legacy-$old"
            for f in dist/SongBridge*; do cp "$f" "legacy-$old/$(basename "$f" | sed "s/^SongBridge/$old/")"; done
            (cd "legacy-$old" && 7z a "../$old-${{ matrix.name }}.zip" . > /dev/null)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SongBridge-${{ matrix.name }}
          path: |
            SongBridge-${{ matrix.name }}.zip
            Liedbruecke-${{ matrix.name }}.zip
            Liederverwaltung-${{ matrix.name }}.zip

  release:
    if: github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SongBridge ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: dist/*.zip
